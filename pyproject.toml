[project]
name = "clutch"
version = "0.1.0"
description = "The AI that won't let you miss what matters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Malay Kumar" }]

dependencies = [
    "typer==0.15.3",
    "rich==14.0.0",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "pyyaml==6.0.2",
    "httpx==0.28.1",
    "feedparser==6.0.11",
    "discord.py==2.6.1",
    "google-auth==2.40.1",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.166.0",
    "apscheduler==3.11.0",
    "sentry-sdk[fastapi]==2.22.0",
    "rumps==0.4.0",
]

[project.optional-dependencies]
temporal = ["temporalio==1.11.0"]
dev = ["ruff==0.11.12", "pytest==8.3.5"]

[project.scripts]
clutch = "clutch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch"]

[tool.ruff]
line-length = 100
target-version = "py312"
