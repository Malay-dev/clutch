clutch:
  schedule: "4h"           # "1h" | "4h" | "nightly" | "30m"
  timezone: "Asia/Kolkata"
  digest_time: "07:00"

profile:
  name: Malay
  interests:
    - AI/ML
    - open source
    - hackathons
    - robotics
    - Bengaluru events
    - developer tools
    - LLMs and agents
  location: Bengaluru

connectors:
  discord:
    enabled: true
    servers:
      - name: GDG Bangalore
        channels: [announcements, events]

  luma:
    enabled: true
    cities: [Bengaluru, Remote]
    categories: [tech, ai, developer]

  rss:
    enabled: true
    feeds:
      - https://dev.to/feed
      - https://news.ycombinator.com/rss

  github:
    enabled: false
    watch:
      - topics: [hacktoberfest, good-first-issue]

  hacktoberfest:
    enabled: true
    countries: [IN]
    cities: [Bengaluru]
    include_ended: false
    include_online: true

  jira:
    enabled: false

  konfhub:
    enabled: true
    countries: [India]
    cities: [Bengaluru]
    include_paid: true

output:
  google_calendar:
    calendar_name: "Clutch Radar"
    colors:
      critical: "11"     # Tomato (red)
      high: "6"          # Tangerine (orange)
      info: "9"          # Peacock (blue)

scoring:
  critical_threshold: 0.80
  high_threshold: 0.50
  auto_expire_days: 3
  max_calendar_events: 10       # max active calendar events at any time
  max_new_per_run: 5            # max new calendar events created per run

ollama:
  host: "http://localhost:11434"
  model: "gemma3:4b"
  timeout: 120
