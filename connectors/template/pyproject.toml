[project]
name = "clutch-connector-template"
version = "0.1.0"
description = "Template connector for Clutch — clone this to build your own"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]

dependencies = [
    "clutch>=0.1.0",
]

[project.entry-points."clutch.connectors"]
template = "clutch_connector_template:TemplateConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch_connector_template"]
