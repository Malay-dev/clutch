[project]
name = "clutch-connector-hacktoberfest"
version = "0.1.0"
description = "Hacktoberfest events connector for Clutch — fetches fests, hack days, and online events from hacktoberfest.com"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Malay Kumar" }]

dependencies = [
    "clutch>=0.1.0",
    "httpx>=0.28.0",
]

[project.entry-points."clutch.connectors"]
hacktoberfest = "clutch_connector_hacktoberfest:HacktoberfestConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch_connector_hacktoberfest"]
