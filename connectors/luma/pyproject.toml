[project]
name = "clutch-connector-luma"
version = "0.1.0"
description = "Luma events connector for Clutch — fetches upcoming events from lu.ma"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Malay Kumar" }]

dependencies = [
    "clutch>=0.1.0",
    "httpx>=0.28.0",
]

[project.entry-points."clutch.connectors"]
luma = "clutch_connector_luma:LumaConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch_connector_luma"]
