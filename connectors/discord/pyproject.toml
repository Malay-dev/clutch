[project]
name = "clutch-connector-discord"
version = "0.1.0"
description = "Discord connector for Clutch — reads announcement and event channels"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Malay Kumar" }]

dependencies = [
    "clutch>=0.1.0",
    "discord.py==2.6.1",
]

[project.entry-points."clutch.connectors"]
discord = "clutch_connector_discord:DiscordConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch_connector_discord"]
