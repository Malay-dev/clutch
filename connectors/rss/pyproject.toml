[project]
name = "clutch-connector-rss"
version = "0.1.0"
description = "RSS/Atom feed connector for Clutch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Malay Kumar" }]

dependencies = [
    "clutch>=0.1.0",
    "feedparser==6.0.11",
]

[project.entry-points."clutch.connectors"]
rss = "clutch_connector_rss:RSSConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch_connector_rss"]
