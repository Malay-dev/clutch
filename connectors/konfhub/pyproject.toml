[project]
name = "clutch-connector-konfhub"
version = "0.1.0"
description = "KonfHub events connector for Clutch — fetches conferences, hackathons, and meetups from konfhub.com"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Malay Kumar" }]

dependencies = [
    "clutch>=0.1.0",
    "httpx>=0.28.0",
]

[project.entry-points."clutch.connectors"]
konfhub = "clutch_connector_konfhub:KonfHubConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutch_connector_konfhub"]
